defaults:
  passengers: 1
  cabin_class: economy
  max_results: 50
  anywhere_concurrency: 10   # max parallel API calls for ANYWHERE searches

cache:
  ttl_seconds: 300           # 5-minute TTL for flight results
  directory: ~/.flight_cache

filters:
  cheap:
    max_price: 200

  nonstop_only:
    stops: 0

  business_trip:
    departure_time_start: "06:00"
    departure_time_end: "10:00"
    stops: 0

  weekend_escape:
    max_price: 400
    stops: 1

