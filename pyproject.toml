[project]
name = "flight-search"
version = "0.1.0"
description = "Fast, interactive CLI flight search — like Google Flights in your terminal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.70.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "diskcache>=5.6.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.scripts]
flights = "flight_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["flight_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
